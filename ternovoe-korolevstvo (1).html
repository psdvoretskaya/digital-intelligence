<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Терновое королевство</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kurale&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: hero band, then a board-game map (snaking trail of glades with a hopping mascot token); each game screen is one focused card with big touch targets. Single deliberate daytime look (pink, orange and violet). */
:root{
  --night:#fff0f6; --bark:#ffffff; --bark2:#fbe1ef; --thorn:#e8b3d6;
  --jade:#8b46d9; --jade-d:#6c2ec0; --gold:#c84f00; --sun:#ffc27a; --rose:#d92d4b; --ok:#1c9a61;
  --ink:#3a1f4d; --mist:#7a5a8c; --skin:#efe2f4; --horn:#120a1a;
  --floor:#fff3f9; --wall:#dba6ea; --paper:#ffffff; --veil:rgba(255,240,246,.92); --veil2:rgba(255,240,246,.985);
  --display:'Kurale', Georgia, 'Times New Roman', serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(1100px 480px at 85% -10%, rgba(255,170,90,.38), transparent 60%),radial-gradient(900px 500px at -10% 0%, rgba(190,130,255,.30), transparent 60%),radial-gradient(900px 600px at 50% 110%, rgba(255,120,180,.22), transparent 60%);
  background-attachment:fixed;min-height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,7vw,54px);line-height:1.02;color:var(--ink)}
h2.sec{font-size:24px;color:var(--gold)}
h3{font-size:20px}
p{margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--jade)}
.lead{color:var(--mist);max-width:52ch;margin-top:8px}
.mini{font-size:14px;color:var(--mist)}
b{font-weight:800}

/* Hero */
.hero{display:flex;gap:20px;align-items:center;padding-block:8px}
.hero > div{min-width:0;display:flex;flex-direction:column}
.fairy{width:132px;height:132px;flex:none}
.fairy .g1{fill:var(--jade);opacity:.16}
.fairy .hn{fill:var(--horn);stroke:var(--thorn);stroke-width:1.5}
.fairy .sk{fill:var(--skin)}
.fairy .ey{stroke:var(--jade);stroke-width:3.2;stroke-linecap:round}
.fairy .lp{stroke:var(--rose);stroke-width:2.6;fill:none;stroke-linecap:round}
.fairy .cl{fill:var(--bark2);stroke:var(--thorn);stroke-width:1.5}
.hero-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
@media (max-width:520px){.hero{flex-direction:column;align-items:flex-start}.fairy{width:96px;height:96px}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--bark2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pill.gold{color:var(--gold)}

/* Buttons */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:17px;background:var(--bark2);color:var(--ink);transition:transform .08s, background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--jade);color:#ffffff}
.btn.primary:hover{background:var(--jade-d)}
.btn.ghost{background:transparent;border:2px solid var(--thorn)}
.btn.ghost:hover{border-color:var(--jade)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:12px}
.btn.danger{background:var(--rose);color:#ffffff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Station path */
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;counter-reset:st}
.path li{counter-increment:st}
.stn{width:100%;height:100%;display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;gap:4px 14px;text-align:left;border:2px solid var(--thorn);background:var(--bark);border-radius:18px;padding:14px;position:relative;transition:border-color .15s, transform .1s}
.stn:hover:not(:disabled){border-color:var(--jade);transform:translateY(-2px)}
.stn::before{content:counter(st);position:absolute;top:8px;right:12px;font-size:12px;font-weight:800;color:var(--mist);font-variant-numeric:tabular-nums}
.stn .sig{grid-row:1 / 3;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--night);color:var(--jade);font-family:var(--display);font-size:24px;border:1px solid var(--thorn)}
.stn .stn-t{display:flex;flex-direction:column;min-width:0;padding-right:14px}
.stn .stn-t b{font-size:17px;line-height:1.2}
.stn .stn-t small{color:var(--mist);font-size:14px;line-height:1.3;margin-top:2px}
.stars{color:var(--gold);letter-spacing:2px;font-size:16px}
.stars i{font-style:normal;color:var(--thorn)}
.stn.locked{opacity:.45;cursor:not-allowed}
.foot{color:var(--mist);font-size:14px}

/* Play */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-title{flex:1;min-width:0;font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:10px}
.tb-sig{color:var(--jade);font-size:18px;background:var(--bark);border:1px solid var(--thorn);border-radius:10px;padding:2px 8px}
.tb-cr{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:8px;border-radius:4px;background:var(--bark2)}
.dot.cur{background:var(--sun)}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--rose)}
.card{background:var(--bark);border:2px solid var(--thorn);border-radius:22px;padding:22px;box-shadow:0 4px 0 var(--thorn)}
.qcard{display:flex;flex-direction:column;gap:18px}
.prompt{font-size:19px;display:flex;flex-direction:column;gap:12px}
.big{font-size:clamp(26px,6vw,38px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center;padding:6px 0;overflow-wrap:anywhere}
.hl{background:var(--sun);color:#3a2604;border-radius:8px;padding:0 6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.wide{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:60px;border-radius:16px;border:2px solid var(--thorn);background:var(--bark2);font-size:22px;font-weight:800;padding:10px 12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.opts.wide .opt{font-size:20px}
.opt:hover:not(:disabled){border-color:var(--jade)}
.opt.right{background:var(--ok);color:#ffffff;border-color:var(--ok)}
.opt.wrong{background:var(--rose);color:#ffffff;border-color:var(--rose)}
.opt:disabled{cursor:default}
.fb{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fb:empty{display:none}
.fb.good .fb-t{color:var(--ok)}
.fb.oops .fb-t{color:var(--rose)}
.fb-t{font-family:var(--display);font-size:24px}
.fb-x{color:var(--ink);background:var(--night);border-radius:14px;padding:12px 14px;max-width:62ch;font-size:17px}
.step{font-weight:800;color:var(--gold)}

/* Keypad */
.kp{display:flex;flex-direction:column;gap:10px;align-items:center}
.kp-disp{min-width:150px;text-align:center;font-size:40px;font-weight:900;border-radius:16px;padding:4px 18px;background:var(--night);border:2px solid var(--thorn);font-variant-numeric:tabular-nums}
.kp-disp.empty{color:var(--thorn)}
.kp-disp.right{border-color:var(--ok);color:var(--ok)}
.kp-disp.wrong{border-color:var(--rose);color:var(--rose)}
.kp-keys{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.key{height:58px;border-radius:14px;border:0;background:var(--bark2);font-size:26px;font-weight:800}
.key:hover:not(:disabled){background:var(--thorn)}
.key.ok{background:var(--jade);color:#ffffff;font-size:20px}
.key.fn{font-size:22px}
.key:disabled{opacity:.5}

/* Bags picture */
.bags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bag{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:84px;min-height:70px;padding:10px 6px 8px;border-radius:12px 12px 26px 26px;background:var(--bark2);border:2px solid var(--thorn);font-size:22px;line-height:1;position:relative}
.bag::before{content:"";position:absolute;top:-8px;left:50%;width:30px;height:10px;transform:translateX(-50%);border:2px solid var(--thorn);border-bottom:0;border-radius:10px 10px 0 0}

/* Expressions */
.expr{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px;font-size:clamp(26px,6vw,36px);font-weight:900;font-variant-numeric:tabular-nums;padding-top:22px}
.ex-p{color:var(--gold)}
.ex-o{padding:0 4px}
.ex-op{position:relative;border:2px dashed var(--thorn);background:var(--night);border-radius:12px;min-width:46px;height:52px;font-size:30px;font-weight:900;padding:0 6px}
.ex-op:hover:not(:disabled){border-color:var(--jade)}
.ex-op .ord{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:16px;color:var(--night);background:var(--sun);border-radius:999px;min-width:24px;height:24px;line-height:24px;display:none}
.ex-op.on{border-style:solid;border-color:var(--sun)}
.ex-op.on .ord{display:block}
.ex-op.fix .ord{background:var(--jade);display:block}

/* Magic square */
.msq{display:grid;grid-template-columns:repeat(3,76px);gap:8px;justify-content:center}
.mc{height:76px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--bark2);border:2px solid var(--thorn)}
button.mc{background:var(--night);border:2px dashed var(--jade-d);color:var(--jade)}
button.mc.sel{border-style:solid;border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,210,87,.5)}
button.mc.bad{border-color:var(--rose);color:var(--rose)}
.msum{text-align:center;font-weight:800;color:var(--gold);font-size:18px}

/* Logic grid */
.lgwrap{overflow-x:auto}
.lg{border-collapse:separate;border-spacing:6px;margin:0 auto}
.lg th{font-size:14px;font-weight:800;color:var(--mist);padding:2px 4px}
.lg th.rn{text-align:right;color:var(--ink);font-size:16px}
.lgc{width:54px;height:48px;border-radius:12px;border:2px solid var(--thorn);background:var(--night);font-size:24px;font-weight:900}
.lgc.y{color:var(--ok);border-color:var(--ok)}
.lgc.n{color:var(--rose)}
tr.badrow .lgc{box-shadow:0 0 0 2px var(--rose)}
.clues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}

/* Euler */
.eu{width:100%;max-width:420px;height:auto;margin:0 auto;display:block}
.eu-u{fill:var(--night);stroke:var(--thorn);stroke-width:2}
.eu-a{fill:rgba(139,70,217,.14);stroke:var(--jade);stroke-width:3}
.eu-b{fill:rgba(255,150,60,.16);stroke:var(--gold);stroke-width:3}
.eu-l{font:800 14px var(--body);fill:var(--ink)}
.eu-n{font:900 26px var(--body);fill:var(--ink)}
.eu-q{font:900 26px var(--body);fill:var(--rose)}
.eu-chip{fill:var(--bark2);stroke:var(--gold);stroke-width:2}

/* Arcade */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qbig{font-size:clamp(28px,7vw,40px);font-weight:900;font-variant-numeric:tabular-nums;text-align:center;flex:1;min-width:0}
.lives{color:var(--rose);font-size:24px;letter-spacing:3px;min-width:90px}
.score{font-weight:800;color:var(--gold);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.stage{position:relative;display:flex;justify-content:center;background:var(--bark);border:2px solid var(--thorn);border-radius:20px;padding:8px;overflow:hidden}
.stage canvas{display:block;border-radius:12px;max-width:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:var(--veil);font-size:18px}
.overlay p{max-width:42ch}
.dpad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center}
.dpad button{border:0;border-radius:14px;background:var(--bark2);font-size:26px;touch-action:none}
.dpad button:active{background:var(--thorn)}
.dpad .u{grid-column:2}
.dpad .l{grid-column:1;grid-row:2}
.dpad .d{grid-column:2;grid-row:2}
.dpad .r{grid-column:3;grid-row:2}
@media (hover:hover) and (pointer:fine){.dpad{opacity:.75}}
.opts.four .opt{font-size:28px;min-height:68px}
.toast{color:var(--rose)}

/* End */
.end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.end .bigstars{font-size:54px;letter-spacing:8px;color:var(--gold)}
.end .bigstars i{font-style:normal;color:var(--thorn)}
.end h2{font-size:32px}

/* Book */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:2px solid var(--thorn);background:var(--bark);border-radius:12px;padding:8px 14px;font-weight:800}
.tab.on{background:var(--jade);color:#ffffff;border-color:var(--jade)}
.tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbl div{background:var(--night);border-radius:12px;padding:10px 14px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tbl div span{color:var(--jade)}
.tip{background:var(--bark2);border-radius:14px;padding:12px 16px}

/* Adult */
.panel{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--thorn);background:var(--night);border-radius:12px;min-width:48px;padding:8px 12px;font-weight:800;font-size:17px}
.chip.on{background:var(--jade);color:#ffffff;border-color:var(--jade)}
.set-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.set-row > span{min-width:0;flex:1 1 220px}
.set-row small{display:block;color:var(--mist);font-size:14px}
.sw{position:relative;width:58px;height:32px;border-radius:999px;border:0;background:var(--bark2);flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--mist);transition:left .15s}
.sw.on{background:var(--jade-d)}
.sw.on::after{left:30px;background:#ffffff}
input.txt{background:var(--night);border:2px solid var(--thorn);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;width:min(100%,280px)}
.heatwrap{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
.heat th{font-size:13px;color:var(--mist);padding:2px 6px}
.heat td{width:44px;height:38px;border-radius:8px;text-align:center;font-size:13px;font-weight:800;background:var(--night);color:var(--mist)}
.heat td.g{background:rgba(98,227,166,.75);color:#0f2a1d}
.heat td.m{background:rgba(243,201,108,.8);color:#3a2604}
.heat td.b{background:rgba(255,125,157,.85);color:#ffffff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mist)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.stlist{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;font-size:15px;font-variant-numeric:tabular-nums}
.stlist .h{color:var(--mist);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.mlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.mlist em{font-style:normal;color:var(--rose)}
.mlist strong{color:var(--ok)}
.method{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.method h3{color:var(--gold);margin-top:6px}
.method ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.card summary{cursor:pointer;font-family:var(--display);font-size:22px;color:var(--gold)}
details.card[open] summary{margin-bottom:12px}
.boss{display:flex;align-items:center;gap:14px}
.boss svg{width:64px;height:64px;flex:none}
.boss .sh{fill:#0b0610;stroke:var(--rose);stroke-width:2}
.boss .se{fill:var(--rose)}
.hp{flex:1;height:16px;border-radius:999px;background:var(--bark2);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),#ff9d6b);transition:width .4s}

@media (max-width:420px){
  .kp-keys{grid-template-columns:repeat(3,64px)}
  .msq{grid-template-columns:repeat(3,68px)}
  .mc{height:68px}
  .card{padding:16px}
  .opts.three .opt{font-size:22px}
}

.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bdg{display:inline-flex;align-items:center;gap:6px;background:var(--bark);border:2px solid var(--thorn);border-radius:999px;padding:3px 12px 3px 6px;font-weight:800;font-size:14px}
.tip p{margin:0}.tip p+p{margin-top:6px}
.rgrid{display:grid;gap:3px;width:100%;max-width:340px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.rc{aspect-ratio:1;border-radius:6px;background:var(--bark2);border:1px solid var(--thorn)}
.rc.on{background:var(--sun);border-color:var(--gold)}
.rgrid.draw .rc{cursor:crosshair}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,104px));gap:12px;justify-content:center;width:100%}
.hole{aspect-ratio:1;border-radius:50%;background:var(--bark2);border:3px solid var(--thorn);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;color:#ffffff;touch-action:manipulation;padding:0}
.hole.up{background:#c98f5c;border-color:#8a5a2b}
.hole.hit{background:var(--ok);border-color:var(--ok)}
.hole.miss{background:var(--rose);border-color:var(--rose)}
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:480px;margin:0 auto;width:100%}
.mcard{aspect-ratio:1;border-radius:14px;border:2px solid var(--jade-d);background:repeating-linear-gradient(45deg,var(--jade) 0 10px,var(--jade-d) 10px 20px);font-size:clamp(17px,4.6vw,24px);font-weight:900;font-variant-numeric:tabular-nums;padding:2px;color:var(--ink)}
.mcard span{visibility:hidden}
.mcard.open{background:var(--bark);border-color:var(--sun)}
.mcard.open span{visibility:visible}
.mcard.done{border-color:var(--ok);background:var(--bark);opacity:.75}
.lane{position:relative;width:100%;height:240px;border-radius:12px;background:linear-gradient(var(--bark2),var(--bark));overflow:hidden}
.fcard{position:absolute;top:0;min-width:72px;height:56px;border-radius:14px;background:var(--bark);border:3px solid var(--jade);display:grid;place-items:center;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;padding:0 10px}
.fcard.good{background:var(--ok);border-color:var(--ok);color:#ffffff}
.fcard.badc{background:var(--rose);border-color:var(--rose);color:#ffffff}
.schopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.schopt{border:2px solid var(--thorn);background:var(--bark);border-radius:14px;padding:6px}
.schopt:hover:not(:disabled){border-color:var(--jade)}
.schopt.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.schopt.wrong{border-color:var(--rose);opacity:.5}
.schm{display:block;width:100%;height:auto}
.sb{fill:var(--bark2);stroke:var(--thorn);stroke-width:2}
.sb.s2{fill:var(--sun)}.sb.s3{fill:var(--bark);stroke-dasharray:5 4}.sb.s4{fill:#ffd0da}
.st{font:800 15px var(--body);fill:var(--ink)}.st.sm2{font-size:12px}
.sq{fill:none;stroke:var(--jade);stroke-width:2}.st.sqq{fill:var(--jade)}
pre.rep{white-space:pre-wrap;font:600 15px var(--body);margin:0}
.qnav{display:flex;flex-wrap:wrap;gap:8px}
.qn{width:42px;height:42px;border-radius:50%;border:2px solid var(--thorn);background:var(--bark);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.qn:hover{border-color:var(--jade)}
.qn.ok{background:var(--ok);border-color:var(--ok);color:#ffffff}

/* v2: board, stickers, modal, theory, match-up, journal, console */
.mascot{width:54px;height:54px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}

.stk.sm{font-size:22px}
.board{position:relative}
#trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

.node:hover:not(:disabled){border-color:var(--jade)}

.token{position:absolute;transform:translate(-50%,-50%);transition:left .55s cubic-bezier(.3,1.3,.5,1),top .55s cubic-bezier(.3,1.3,.5,1);pointer-events:none;z-index:2}

.modal{position:fixed;inset:0;z-index:50;background:var(--veil2);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,6vh) 16px 24px;overflow:auto}
.modal .card.end{width:min(520px,100%)}
.thm{width:min(640px,100%);display:flex;flex-direction:column;gap:14px}

.toastbar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--night);font-weight:800;padding:10px 18px;border-radius:999px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.padb{width:84px;height:56px;font-size:22px;touch-action:none}
.th{display:flex;flex-direction:column;gap:10px}

.ordx{font-weight:800;font-variant-numeric:tabular-nums}

.mtiles{display:flex;flex-wrap:wrap;gap:8px;min-height:54px}
.mtile{touch-action:none;border:2px solid var(--gold);background:var(--bark2);border-radius:12px;padding:10px 16px;font-size:20px;font-weight:900;cursor:grab;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
.mtile.sel{background:var(--sun);color:#3a2604}
.mtile.lifting{opacity:.3}
.mtile.ghost{position:fixed;margin:0;transform:translate(-50%,-50%) rotate(-4deg);pointer-events:none;z-index:70;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.mslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mslot{display:flex;align-items:center;gap:8px;justify-content:center;min-height:56px;border-radius:12px;border:2px dashed var(--thorn);background:var(--night);font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink);padding:6px}
.mslot .hole{width:62px;height:34px;border-radius:8px;border:2px dashed var(--mist);flex:none}
.mslot.over{border-color:var(--sun);background:var(--bark2)}
.mslot.done{border-style:solid;border-color:var(--ok);color:var(--ok)}

@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.tcard p{font-size:14px;color:var(--mist)}
.tcard.all{border-color:var(--ok)}
.tablewrap{overflow-x:auto}

table.log th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mist);padding:8px 10px;border-bottom:2px solid var(--thorn)}

<body>

<div id="app"></div>

<script>
(function(){
'use strict';
/* ---------- state ---------- */
const KEY='ternovoe-v2';
const DEFP=()=>({crystals:0,st:{},facts:{},mistakes:[],book:{},pos:0});
const DEF=()=>({set:{tables:[2,3,4],level:2,parenMul:false,seq:false,sound:true,timer:'off',secs:45,lives:3},roster:[],who:'',prof:{}});
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.set){const d=DEF();return Object.assign(d,r,{set:Object.assign(d.set,r.set)});}}catch(e){}return DEF();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function PF(){const k=S.who||'_';const p=S.prof[k]||(S.prof[k]=DEFP());if(!p.book)p.book={};if(p.pos==null)p.pos=0;return p;}
const whoName=()=>S.who||'Игрок';
let scr='',paused=false,inGame=false,curSess=null,pauseAt=0,keyStash=null;

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
const rep=(a,b)=>Array(b).fill(a).join(' + ');
function pl(n,a,b,c){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<12||m100>14))return b;return c;}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const app=document.getElementById('app');
let cleanup=null;
function setScreen(html,name){if(cleanup){const c=cleanup;cleanup=null;c();}scr=name||'';inGame=false;paused=false;curSess=null;keyStash=null;['pauseM','helloM'].forEach(i=>{const m=document.getElementById(i);if(m)m.remove();});window.onkeydown=null;app.innerHTML=html;window.scrollTo(0,0);}
const PRAISE=['Верно!','Волшебно!','Точно в цель!','Отлично!','Так держать!','Умница!','Заклинание сработало!'];

/* ---------- sound ---------- */
let actx=null;
function tone(f,d=.12,type='sine',v=.07,delay=0){if(!S.set.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;const t=actx.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const sfx={ok(){tone(660,.1);tone(880,.16,'sine',.07,.09);},bad(){tone(210,.25,'triangle',.08);},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'sine',.07,i*.11));},tick(){tone(520,.06,'square',.025);}};

/* ---------- facts (adaptive multiplication) ---------- */
function rec(t,m,ok){const k=t+'·'+m;const f=PF().facts[k]||(PF().facts[k]={ok:0,bad:0});if(ok)f.ok++;else f.bad++;}
let lastKey='';
function pickFact(){
  const T=S.set.tables.length?S.set.tables:[2];
  for(let tries=0;tries<8;tries++){
    const items=[];let sum=0;
    for(const t of T)for(let m=1;m<=10;m++){const f=PF().facts[t+'·'+m]||{ok:0,bad:0};let w=1+2*f.bad-.2*f.ok;if(m===1||m===10)w*=.5;w=Math.max(.3,Math.min(6,w));items.push([t,m,w]);sum+=w;}
    let r=Math.random()*sum,it=items[items.length-1];
    for(const x of items){r-=x[2];if(r<=0){it=x;break;}}
    const k=it[0]+'·'+it[1];
    if(k!==lastKey||tries===7){lastKey=k;const t=it[0],m=it[1];const sw=Math.random()<.3&&t!==m;return{t,m,x:sw?m:t,y:sw?t:m,ans:t*m};}
  }
}
function distract(f,n=3){const{t,m,ans}=f;const tier1=shuffle([t*(m+1),t*(m-1),(t+1)*m,(t-1)*m]);const tier2=shuffle([ans+1,ans-1,ans+2,ans-2,t+m,ans+10]);const out=[];for(const v of tier1.concat(tier2)){if(v>0&&v!==ans&&!out.includes(v))out.push(v);if(out.length>=n)break;}return out;}
function logMistake(s,q,g,r){const pf=PF();pf.mistakes.unshift({d:Date.now(),s,q:String(q),g:String(g),r:String(r)});pf.mistakes=pf.mistakes.slice(0,40);}

/* ---------- progress ---------- */
function starsFor(ok,total){const r=ok/total;return r>=.9?3:r>=.7?2:r>=.4?1:0;}
function finishStation(id,ok,total,override){const pf=PF();const stars=override!=null?override:starsFor(ok,total);const st=pf.st[id]||(pf.st[id]={stars:0,plays:0});st.plays++;st.stars=Math.max(st.stars,stars);st.last={ok,total,d:Date.now(),stars};pf.crystals+=ok;save();checkBadges();return stars;}
const starStr=n=>'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i>';
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const livesMax=()=>S.set.lives?S.set.lives:Infinity;
const heartStr=n=>isFinite(n)?'♥'.repeat(Math.max(0,n))+'♡'.repeat(Math.max(0,S.set.lives-n)):'♥ ∞';
let toastT=0;
function toast(t){let el=document.getElementById('toastB');if(!el){el=document.createElement('div');el.id='toastB';el.className='toastbar';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},2600);}

/* ---------- pause ---------- */
function pauseGame(custom){
  if(paused||!inGame)return;paused=true;pauseAt=Date.now();keyStash=window.onkeydown;
  const m=document.createElement('div');m.className='modal';m.id='pauseM';
  m.innerHTML=typeof custom==='string'?custom:`<div class="card end" role="dialog" aria-modal="true" aria-labelledby="pzT"><div class="mascot">${MASCOT}</div><h2 id="pzT">Пауза</h2><p>Игра ждёт тебя. Задание спрятано, время остановлено.</p><div class="row" style="justify-content:center"><button class="btn primary" id="resume">Продолжить</button><button class="btn ghost" id="pHome">На карту</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#resume').onclick=()=>resumeGame();const ph=m.querySelector('#pHome');if(ph)ph.onclick=()=>{resumeGame();home();};
  window.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();resumeGame();}};
  m.querySelector('#resume').focus();
}
function resumeGame(){if(!paused)return;paused=false;const m=document.getElementById('pauseM');if(m)m.remove();if(curSess)curSess.skip=(curSess.skip||0)+Date.now()-pauseAt;window.onkeydown=keyStash;keyStash=null;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});

/* ---------- timer ---------- */
function mkClock(el){
  let t=null,mode='off',left=0,up=0,onEnd=null,running=false;
  const render=()=>{if(mode==='off'){el.hidden=true;return;}el.hidden=false;el.textContent=(mode==='up'?'⏱ ':'⏳ ')+fmtT(mode==='up'?up:left);el.classList.toggle('warn',mode==='down'&&running&&left<=5);};
  const tick=()=>{if(paused)return;if(mode==='up')up++;else if(running){left--;if(left<=0){left=0;running=false;render();const f=onEnd;onEnd=null;if(f)f();return;}}render();};
  return{init(){mode=S.set.timer;up=0;if(mode!=='off')t=setInterval(tick,1000);render();},q(secs,cb){if(mode!=='down')return;left=secs;onEnd=cb;running=true;render();},hold(){running=false;onEnd=null;render();},stop(){clearInterval(t);}};
}

/* ---------- journal ---------- */
// One row per game attempt, rewritten after every answer, so an unfinished game is kept too.
// Saved to the artifact's shared store when the viewer offers one; otherwise to this browser.
const LOG={remote:[],local:[],db:null,dbWrite:true,who:null,sec:'',open:'',confirm:false};
try{LOG.local=JSON.parse(localStorage.getItem(KEY+'-log')||'[]');}catch(e){LOG.local=[];}
const logRows=()=>{const ids=new Set(LOG.remote.map(r=>r.id));return [...LOG.remote,...LOG.local.filter(r=>!ids.has(r.id))].filter(r=>r&&r.section).sort((a,b)=>(b.upd||b.at)-(a.upd||a.at));};
const saveLocal=()=>{try{localStorage.setItem(KEY+'-log',JSON.stringify(LOG.local.slice(0,500)));}catch(e){}};
const sess=()=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),at:Date.now(),skip:0});
const CHAIN=new Map();
function localPut(id,row){const i=LOG.local.findIndex(r=>r.id===id),r={id,...row};if(i>=0)LOG.local[i]=r;else LOG.local.unshift(r);saveLocal();if(scr==='log')journal(true);}
function jrec(sn,f){
  const row={at:sn.at,upd:Date.now(),item:f.item,section:f.section,player:whoName(),done:!!f.done,ok:!!f.ok,miss:f.miss||0,hints:f.hints||0,result:f.result||'',detail:String(f.detail||'').slice(0,1200),sec:Math.max(0,Math.round((Date.now()-sn.at-(sn.skip||0))/1000))};
  if(f.done&&!sn.told){sn.told=true;toast('Результат сохранён в журнал');}
  if(LOG.db&&LOG.dbWrite){const prev=CHAIN.get(sn.id)||Promise.resolve();
    CHAIN.set(sn.id,prev.then(()=>LOG.db.doc('results/'+sn.id).set(row)).catch(e=>{
      if(e&&e.code==='quota_exceeded'){toast('Журнал переполнен: удалите старые записи');return;}
      if(e&&['invalid_argument','revoked','not_granted','capability_disabled','capability_removed'].includes(e.code))LOG.dbWrite=false;
      localPut(sn.id,row);}));return;}
  localPut(sn.id,row);
}
(async()=>{try{const db=await (window.claude&&window.claude.use?window.claude.use('db'):null);if(!db)return;LOG.db=db;
  db.collection('results').orderBy('at','desc').limit(500).onSnapshot(sn=>{LOG.remote=sn.docs.map(d=>({id:d.id,...d.data()}));if(scr==='log')journal(true);},()=>{LOG.db=null;LOG.remote=[];if(scr==='log')journal(true);});
  if(scr==='log')journal(true);}catch(e){}})();

/* ---------- stations ---------- */
const STATIONS=[
 {id:'bags',stk:'👝',name:'Волшебные мешочки',sub:'Что такое умножение: по a взять b раз',run:()=>runQuiz('bags',{total:8,gen:genBags})},
 {id:'rect',stk:'🌷',name:'Грядки-прямоугольники',sub:'Площадь прямоугольника: ряды и столбцы',tmul:3,run:()=>runQuiz('rect',{total:6,gen:genRect})},
 {id:'mirror',stk:'🪞',name:'Зеркало перестановки',sub:'Переставь множители, ×0 и ×1, найди множитель',run:()=>runQuiz('mirror',{total:10,gen:genMirror})},
 {id:'tricks',stk:'🧠',name:'Школа приёмов',sub:'Как найти ответ, если забыла таблицу',tmul:3,run:()=>runQuiz('tricks',{total:6,gen:genTricks})},
 {id:'maze',stk:'🗝️',name:'Лабиринт дракончика',sub:'Таблица умножения — убегай от колючек',run:startMaze},
 {id:'catch',stk:'☁️',name:'Перехват в облаках',sub:'Лови облако с верным ответом',run:startCatch},
 {id:'mole',stk:'🐹',name:'Ударь крота',sub:'Бей только числа из нужной таблицы',run:startMole},
 {id:'memo',stk:'🃏',name:'Парочки-перевёртыши',sub:'Найди пару: выражение и ответ',run:startMemo},
 {id:'sort',stk:'🧺',name:'Сортировка',sub:'Разложи числа по таблицам',run:startSort},
 {id:'paren',stk:'🪄',name:'Заклинание скобок',sub:'Порядок действий и выражения со скобками',tmul:2,run:()=>runQuiz('paren',{total:8,gen:genParen})},
 {id:'build',stk:'🧩',name:'Составь выражение',sub:'Расставь знаки и скобки, чтобы получить ответ',tmul:3,run:()=>runQuiz('build',{total:6,gen:genBuild})},
 {id:'magic',stk:'🔢',name:'Магический квадрат',sub:'Суммы в строках, столбцах и диагоналях равны',tmul:5,run:()=>runQuiz('magic',{total:3,gen:genMagic})},
 {id:'logic',stk:'🏠',name:'Загадки Цветочного города',sub:'Логические таблицы: кто где живёт',tmul:5,run:()=>runQuiz('logic',{total:3,gen:genLogic})},
 {id:'euler',stk:'🎯',name:'Круги Эйлера',sub:'Куда попадёт число? Сколько ребят?',tmul:2,run:()=>runQuiz('euler',{total:8,gen:genEuler})},
 {id:'kitchen',stk:'🥐',name:'Кухня Фрекен Бок',sub:'Задачи: схема, выражение, ответ',tmul:4,run:()=>runQuiz('kitchen',{total:6,gen:genKitchen})},
 {id:'boss',stk:'🏆',name:'Турнир Тучки-Ворчуньи',sub:'Олимпиадные задачи для самых смелых',tmul:4,run:()=>runQuiz('boss',{total:8,gen:genBoss,header:bossHeader})},
];
const ST={};STATIONS.forEach(s=>ST[s.id]=s);

const MASCOT=`<svg viewBox="0 0 100 100" aria-hidden="true">
<path d="M28 30 L24 10 L40 24 Z" fill="#f3c96c"/><path d="M72 30 L76 10 L60 24 Z" fill="#f3c96c"/>
<circle cx="50" cy="56" r="37" fill="#c58cf5"/>
<ellipse cx="50" cy="72" rx="21" ry="14" fill="#f6e6ff"/>
<circle cx="36" cy="48" r="10" fill="#fff"/><circle cx="64" cy="48" r="10" fill="#fff"/>

  const w=el.clientWidth,cols=w<470?2:w<700?3:w<860?4:5,rh=156,n=STATIONS.length,cw=w/cols,nw=Math.min(142,cw-12);

  el.querySelectorAll('.node').forEach((b,k)=>{b.style.left=pts[k][0]+'px';b.style.top=pts[k][1]+'px';b.style.width=nw+'px';});
  const d=pts.map((p,k)=>(k?'L':'M')+p[0]+' '+p[1]).join(' ');

  const k=Math.min(n-1,Math.max(0,PF().pos)),tk=document.getElementById('token');

}

function digitPad(withOk){return `<div class="kp-keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-n="${n}">${n}</button>`).join('')}<button class="key fn" data-n="del" aria-label="Стереть">⌫</button><button class="key" data-n="0">0</button>${withOk?'<button class="key ok" data-n="ok">OK</button>':'<span></span>'}</div>`;}
function keypad(el,onOk,max=3){
  let v='',locked=false;
  el.innerHTML=`<div class="kp"><div class="kp-disp empty" aria-live="polite">?</div>${digitPad(true)}</div>`;
  const disp=el.querySelector('.kp-disp');
  const upd=()=>{disp.textContent=v||'?';disp.classList.toggle('empty',!v);};
  const press=n=>{if(locked)return;if(n==='del')v=v.slice(0,-1);else if(n==='ok'){if(!v)return;locked=true;el.querySelectorAll('.key').forEach(k=>k.disabled=true);const good=onOk(+v);disp.classList.add(good?'right':'wrong');if(!good)setTimeout(()=>{if(!disp.isConnected||el.closest('[data-dead]'))return;locked=false;v='';disp.classList.remove('wrong');el.querySelectorAll('.key').forEach(k=>{k.disabled=false;});upd();},700);return;}else if(v.length<max)v=(v==='0'?'':v)+n;upd();};
  el.querySelectorAll('.key').forEach(k=>k.onclick=()=>press(k.dataset.n));
  window.onkeydown=e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Enter'){e.preventDefault();press('ok');}};
}

// All tasks of a station are generated up front; the child may solve them in any order, retry after a mistake and take stepped hints.
const H1={bags:'Умножение — это сумма одинаковых слагаемых: по a взять b раз.',mirror:'От перестановки множителей произведение не меняется. Число · 1 — то же число, число · 0 — ноль.',rect:'Площадь прямоугольника: число клеток в ряду умножь на число рядов.',tricks:'Сделай первое действие приёма и запиши ответ.',paren:'Сначала скобки, потом умножение, потом по порядку слева направо.',build:'Попробуй сначала без скобок. Не выходит — поставь скобки и сначала посчитай то, что в них.',magic:'Найди линию, где известны два числа из трёх.',logic:'Начни с подсказки, где сказано точно. Поставь ✓ и вычеркни остальное в строке и столбце.',euler:'Проверь каждый признак отдельно: подходит или нет.',kitchen:'Что известно? Что надо найти? «По a взяли b раз» — это умножение.',boss:'Нарисуй задачу на листочке и попробуй на маленьких числах.'};
function runQuiz(id,cfg){
  const stn=ST[id],total=cfg.total;const Q=[];for(let k=0;k<total;k++)Q.push({q:cfg.gen(k),res:null,miss:0,hints:0,fb:''});
  let cur=0;const errs=[];
  setScreen(`<div class="wrap play">${topbar(stn,true)}<nav class="qnav" id="prog" aria-label="Задания"></nav><div id="hdr"></div>
   <section class="card qcard"><div class="prompt" id="prompt"></div><div id="ans"></div><div id="hbox" class="tip" hidden></div><div class="row" id="hrow"><button class="btn ghost sm" id="hintBtn">Подсказка</button></div><div class="fb" id="fb" aria-live="polite"></div></section>
   <p class="mini">Задания можно решать в любом порядке: нажми на номер вверху. Ошиблась — попробуй ещё раз.</p></div>`,'game');
  bindTop();inGame=true;const sn=curSess=sess();const clock=mkClock($('#clock'));clock.init();cleanup=()=>clock.stop();
  const cnt=r=>Q.filter(t=>t.res===r).length,sum=k=>Q.reduce((a,t)=>a+t[k],0);
  const nextOpen=()=>{for(let d=1;d<=total;d++){const k=(cur+d)%total;if(!Q[k].res)return k;}return -1;};
  const RES={ok:'решено',fix:'решено с помощью',bad:'не решено'};
  function nav(){$('#prog').innerHTML=Q.map((t,k)=>`<button class="qn ${t.res||''}${k===cur?' cur':''}" data-k="${k}" aria-label="Задание ${k+1}${t.res?', '+RES[t.res]:''}" ${k===cur?'aria-current="true"':''}>${k+1}</button>`).join('');
    $('#prog').querySelectorAll('.qn').forEach(b=>b.onclick=()=>{cur=+b.dataset.k;show();});if(cfg.header)$('#hdr').innerHTML=cfg.header({ok:cnt('ok')+cnt('fix'),total});}
  function jr(){const a=Q.filter(t=>t.res).length,fin=a===total,st=starsFor(cnt('ok')+cnt('fix')*.5,total);
    jrec(sn,{item:id,section:stn.name,done:fin,ok:fin&&st>=1,miss:sum('miss'),hints:sum('hints'),result:`с первой попытки: ${cnt('ok')}, с исправлением или подсказкой: ${cnt('fix')}, не решено: ${cnt('bad')} (заданий: ${total})`+(fin?`, звёзд: ${st}`:''),detail:errs.join('; ')||'без ошибок'});}
  function finish(){const solved=cnt('ok')+cnt('fix'),st=starsFor(cnt('ok')+cnt('fix')*.5,total);finishStation(id,solved,total,st);
    endScreen(id,solved,total,st,cnt('fix')?`<p class="mini">С первой попытки: ${cnt('ok')}. С исправлением или подсказкой: ${cnt('fix')}.</p>`:'');}
  function footer(F){const n=nextOpen();F.insertAdjacentHTML('beforeend',`<button class="btn primary" id="nextBtn">${n<0?'Узнать результат':'Дальше →'}</button>`);
    const go=()=>{if(n<0)finish();else{cur=n;show();}};$('#nextBtn').onclick=go;
    setTimeout(()=>{if(!paused&&scr==='game'&&document.getElementById('nextBtn'))window.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};},50);}
  function show(){
    const t=Q[cur],q=t.q,P=$('#prompt'),A=$('#ans'),F=$('#fb'),HB=$('#hbox'),HR=$('#hrow');clock.hold();window.onkeydown=null;
    P.innerHTML=q.prompt;A.innerHTML='';delete A.dataset.dead;F.innerHTML='';F.className='fb';HB.hidden=true;HB.innerHTML='';nav();
    const plain=q.plain||strip(q.prompt);
    if(t.res){HR.hidden=true;F.className='fb '+(t.res==='bad'?'oops':'good');F.innerHTML=t.fb;footer(F);return;}
    HR.hidden=false;
    const h1=q.h1||H1[id]||'',h2=q.h2||(q.fact&&q.fact[1]>1&&q.fact[1]<=6?`${q.fact[0]} · ${q.fact[1]} — это ${rep(q.fact[0],q.fact[1])}.`:'');
    const hs=[h1,h2].filter(Boolean);
    const hintPaint=()=>{const b=$('#hintBtn');b.textContent=t.hints===0?'Подсказка':t.hints<hs.length?'Ещё подсказка':'Показать решение';if(t.hints>0){HB.hidden=false;HB.innerHTML=hs.slice(0,t.hints).map((x,k)=>`<p><b>Подсказка ${k+1}.</b> ${x}</p>`).join('');}};
    $('#hintBtn').onclick=()=>{if(fin)return;if(t.hints>=hs.length){giveUp('показано решение');return;}t.hints++;jr();hintPaint();};
    hintPaint();
    let fin=false;
    const close=(res,title,x)=>{fin=true;clock.hold();window.onkeydown=null;A.dataset.dead='1';A.querySelectorAll('button,input').forEach(b=>{b.disabled=true;});t.res=res;HR.hidden=true;bump(res==='ok');
      t.fb=`<div class="fb-t">${title}</div>${x?`<div class="fb-x">${x}</div>`:''}`;F.className='fb '+(res==='bad'?'oops':'good');F.innerHTML=t.fb;jr();save();nav();footer(F);$('#nextBtn').scrollIntoView({block:'nearest',behavior:'smooth'});};
    const giveUp=why=>{if(fin)return;if(t.miss===0&&q.fact)rec(q.fact[0],q.fact[1],false);
      if(q.kind==='choice')A.querySelectorAll('.opt').forEach(x=>{if(q.options[+x.dataset.k]===q.answer)x.classList.add('right');});
      let x=q.tx||q.explain||'';if(q.kind==='input')x=`Правильный ответ: <b>${q.answer}</b>. `+x;
      errs.push(`№${cur+1} ${plain.slice(0,70)}: ${why}`);sfx.bad();close('bad',why==='время вышло'?'Время вышло. Вот решение:':'Вот решение. Разберись в нём и иди дальше.',x);};
    const miss=given=>{if(fin)return;t.miss++;if(t.miss===1&&q.fact)rec(q.fact[0],q.fact[1],false);
      const r=q.answer!=null?strip(String(q.answer)):'—';logMistake(stn.name,plain,given,r);errs.push(`№${cur+1} ${plain.slice(0,70)}: ответ «${given}»`);jr();save();sfx.bad();
      F.className='fb oops';F.innerHTML=`<div class="fb-t">Не совсем. Попробуй ещё раз!</div>`;};
    const done=(good,given,explain)=>{if(fin)return;if(!good){miss(given);return;}if(t.miss===0&&q.fact)rec(q.fact[0],q.fact[1],true);sfx.ok();const help=t.miss||t.hints;
      close(help?'fix':'ok',t.miss?'Получилось! Ошибка исправлена.':t.hints?'Получилось! Подсказка помогла.':pick(PRAISE),explain||q.explain||'');};
    if(q.kind==='choice'){
      A.innerHTML=`<div class="opts ${q.cls||''}">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
      A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(fin)return;const o=q.options[+b.dataset.k];if(o===q.answer){b.classList.add('right');done(true,strip(o));}else{b.classList.add('wrong');b.disabled=true;miss(strip(o));}});
    }else if(q.kind==='input'){keypad(A,v=>{if(v===q.answer){done(true,v);return true;}miss(v);return false;},q.max||3);}
    else if(q.kind==='custom'){q.mount(A,done,miss);}
    clock.q(S.set.secs*(stn.tmul||1),()=>giveUp('время вышло'));
  }

}

/* ---------- 1. bags ---------- */
const ITEMS=['🌹','🍄','🦇','💎','🌙','🍎','⭐','🫐'];
let bagOrder=[];
function fillOpts(right,cands,n=4){const out=[right];for(const c of cands){if(!out.includes(c))out.push(c);if(out.length>=n)break;}return shuffle(out);}
function genBags(i){
  if(i===0)bagOrder=shuffle(['pic','sum2prod','prod2sum','canMul','parts','compute','times','pic']);
  const k=bagOrder[i%bagOrder.length];
  if(k==='pic'){let a=rnd(2,5),b=rnd(2,5);if(a===b)b=a===5?4:a+1;const it=pick(ITEMS);
    const bags=Array.from({length:b},()=>`<div class="bag">${Array(a).fill(`<span>${it}</span>`).join('')}</div>`).join('');
    const right=`${a} · ${b}`;
    return{kind:'choice',prompt:`<p>В каждом мешочке по <b>${a}</b>. Мешочков <b>${b}</b>. Как записать умножением, сколько всего?</p><div class="bags" role="img" aria-label="${b} мешочков по ${a}">${bags}</div>`,options:fillOpts(right,[`${a} + ${b}`,`${a} · ${b+1}`,`${a+1} · ${b}`,`${a+b} · ${b}`]),answer:right,plain:`${b} мешочков по ${a}: записать умножением`,explain:`По ${a} взяли ${b} раз: ${rep(a,b)} = ${a*b}. Записываем: <b>${a} · ${b} = ${a*b}</b>.`};}
  if(k==='sum2prod'){const a=rnd(2,9);let b=rnd(3,5);if(a===b)b++;const right=`${a} · ${b}`;
    return{kind:'choice',prompt:`<p>Замени сумму произведением:</p><div class="big">${rep(a,b)}</div>`,options:fillOpts(right,[`${a} + ${b}`,`${a} · ${b-1}`,`${b} · ${b}`,`${a} · ${b+1}`]),answer:right,explain:`Слагаемое ${a} повторяется ${b} раз, значит это ${a} · ${b} = ${a*b}.`};}
  if(k==='prod2sum'){const a=rnd(2,9),b=rnd(2,4);const right=rep(a,b);

/* ---------- 2. mirror ---------- */
let mirOrder=[];
function genMirror(i){
  if(i===0)mirOrder=shuffle(['swap','swap','compare','compare','zero','zero','skip','skip','rev','find']);
  const k=mirOrder[i%mirOrder.length];
  if(k==='swap'){let f=pickFact();let g=0;while(f.t===f.m&&g++<5)f=pickFact();const{t,m}=f;
    const v=Math.random()<.5;
    return{kind:'input',prompt:`<p>Какое число спряталось?</p><div class="big">${v?`${t} · ${m} = ${m} · ?`:`${t} · ${m} = ? · ${t}`}</div>`,answer:v?t:m,explain:`От перестановки множителей произведение не меняется: ${t} · ${m} = ${m} · ${t} = ${t*m}.`};}
  if(k==='compare'){
    const ty=rnd(1,5);let L,R,lv,rv;
    const a=pick(S.set.tables),b=rnd(2,9);
    if(ty===1){L=`${a} · ${b}`;R=`${b} · ${a}`;lv=rv=a*b;}
    else if(ty===2){const up=Math.random()<.5;L=`${a} · ${b}`;R=`${a} · ${up?b+1:b-1}`;lv=a*b;rv=a*(up?b+1:b-1);if(Math.random()<.5){[L,R]=[R,L];[lv,rv]=[rv,lv];}}
    else if(ty===3){const n=rnd(2,50);const z=Math.random()<.5;L=z?`${n} · 0`:`${n} · 1`;R=z?`1 · ${n}`:`0 · ${n}`;lv=z?0:n;rv=z?n:0;}
    else if(ty===4){const c=rnd(3,4);const cc=Math.random()<.5?c:c+1;L=rep(a,c);R=`${a} · ${cc}`;lv=a*c;rv=a*cc;}
    else{const x=rnd(3,9),y=rnd(3,9);L=`${x} · ${y}`;R=`${x} + ${y}`;lv=x*y;rv=x+y;}
    const sign=lv<rv?'<':lv>rv?'>':'=';
    return{kind:'choice',cls:'three',prompt:`<p>Сравни. Какой знак поставить вместо ○?</p><div class="big">${L} ○ ${R}</div>`,options:['<','=','>'],answer:sign,explain:`${L} = ${lv}, ${R} = ${rv}, значит ${L} <b>${sign}</b> ${R}.`};}
  if(k==='zero'){const n=rnd(2,99),f=rnd(1,4);const e=[`${n} · 1`,`1 · ${n}`,`${n} · 0`,`0 · ${n}`][f-1];const ans=f<=2?n:0;
    return{kind:'input',prompt:`<p>Вычисли:</p><div class="big">${e} = ?</div>`,answer:ans,explain:f<=2?'Если умножить число на 1, получится то же самое число.':'Если один из множителей 0, произведение равно 0.'};}
  if(k==='rev'){let f=pickFact();let g=0;while(f.m<2&&g++<6)f=pickFact();const{t,m,ans}=f;const v=Math.random()<.5;
    return{kind:'input',fact:[t,m],plain:v?`? · ${m} = ${ans}`:`${t} · ? = ${ans}`,h2:`Посчитай шагами по ${v?m:t}, пока не получится ${ans}.`,prompt:`<p>Какой множитель спрятался?</p><div class="big">${v?`? · ${m} = ${ans}`:`${t} · ? = ${ans}`}</div>`,answer:v?t:m,explain:`${t} · ${m} = ${ans}. Проверяем: ${rep(v?m:t,v?t:m)} = ${ans}.`};}
  if(k==='find'){const f=pickFact();const right=`${f.x} · ${f.y}`;const c=[];let g=0;while(c.length<3&&g++<80){const a=rnd(2,9),b=rnd(2,9),e=`${a} · ${b}`;if(a*b!==f.ans&&Math.abs(a*b-f.ans)<=12&&!c.includes(e))c.push(e);}
    return{kind:'choice',fact:[f.t,f.m],prompt:`<p>Какое произведение равно этому числу?</p><div class="big">${f.ans}</div>`,options:fillOpts(right,c),answer:right,explain:`${right} = ${f.ans}.`};}
  const t=pick(S.set.tables),k0=rnd(1,4),h=rnd(1,4);const seq=[0,1,2,3,4].map(j=>t*(k0+j));
  return{kind:'input',fact:[t,k0+h],prompt:`<p>Ворон прыгает по ступенькам через ${t}. Какое число пропущено?</p><div class="big">${seq.map((v,j)=>j===h?'<span class="hl">?</span>':v).join(', ')}</div>`,answer:seq[h],explain:`Каждый прыжок — плюс ${t}: ${seq[h-1]} + ${t} = ${seq[h]}. Это ${t} · ${k0+h}.`};
}

/* ---------- 3. maze ---------- */
function makeMaze(cw,ch){
  const C=cw*2+1,R=ch*2+1;const g=Array.from({length:R},()=>Array(C).fill(1));

  while(st.length){const[x,y]=st[st.length-1];const nb=shuffle([[1,0],[-1,0],[0,1],[0,-1]]).map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([nx,ny])=>nx>=0&&ny>=0&&nx<cw&&ny<ch&&!vis[ny][nx]);
    if(!nb.length){st.pop();continue;}const[nx,ny,dx,dy]=nb[0];vis[ny][nx]=true;g[y*2+1+dy][x*2+1+dx]=0;g[ny*2+1][nx*2+1]=0;st.push([nx,ny]);}
  // knock extra walls for loops
  const walls=[];for(let r=1;r<R-1;r++)for(let c=1;c<C-1;c++){if(g[r][c]===1&&((r%2===1&&c%2===0&&g[r][c-1]===0&&g[r][c+1]===0)||(r%2===0&&c%2===1&&g[r-1][c]===0&&g[r+1][c]===0)))walls.push([r,c]);}
  shuffle(walls).slice(0,14).forEach(([r,c])=>g[r][c]=0);
  return g;
}

function tokenize(s){const out=[];s=s.replace(/\s+/g,'');let i=0;while(i<s.length){const c=s[i];if(/[0-9]/.test(c)){let j=i;while(j<s.length&&/[0-9]/.test(s[j]))j++;out.push({t:'n',v:+s.slice(i,j)});i=j;continue;}if(/[A-Z]/.test(c)){out.push({t:'n',name:c});i++;continue;}if('+-·*−'.includes(c)){out.push({t:'op',op:c==='*'?'·':c==='−'?'-':c});i++;continue;}if(c==='('||c===')'){out.push({t:c});}i++;}out.forEach((tk,k)=>tk.id=k);return out;}

  function term(){let l=fac();while(pk()&&pk().t==='op'&&pk().op==='·'){const o=tk[p++];const r=fac();l={t:'op',op:'·',id:o.id,l,r};}return l;}
  function fac(){const t=tk[p++];if(t.t==='('){const e=expr();p++;return e;}return{t:'n',tok:t};}

function ev(n,vals,flag){if(n.t==='n')return n.tok.name?vals[n.tok.name]:n.tok.v;const a=ev(n.l,vals,flag),b=ev(n.r,vals,flag);const r=n.op==='+'?a+b:n.op==='-'?a-b:a*b;if(r<0||r>100)flag.bad=true;if(n.op==='-'&&r===0)flag.bad=true;if(n.op==='·'&&(a<2||b<2))flag.bad=true;return r;}
function opOrder(n,out=[]){if(n.t==='op'){opOrder(n.l,out);opOrder(n.r,out);out.push(n.id);}return out;}
function mulSub(n,set=new Set(),under=false){if(n.t==='n'){if(under&&n.tok.name)set.add(n.tok.name);return set;}const u=under||n.op==='·';mulSub(n.l,set,u);mulSub(n.r,set,u);return set;}
const opSym=o=>o==='-'?'−':o==='·'?'·':'+';
function stepsOf(n,vals,out=[]){if(n.t==='n')return n.tok.name?vals[n.tok.name]:n.tok.v;const a=stepsOf(n.l,vals,out),b=stepsOf(n.r,vals,out);const r=n.op==='+'?a+b:n.op==='-'?a-b:a*b;out.push(`${a} ${opSym(n.op)} ${b} = ${r}`);return r;}
function stepsHtml(ast,vals){const s=[];stepsOf(ast,vals,s);return s.map((x,k)=>`<b>${k+1})</b> ${x}`).join('&nbsp;&nbsp; ');}

function exprHtml(tk,vals,click){return tk.map(t=>{if(t.t==='n')return `<span class="ex-n">${t.name?vals[t.name]:t.v}</span>`;if(t.t==='op')return click?`<button class="ex-op" data-id="${t.id}" aria-label="знак ${opSym(t.op)}"><span class="ord"></span>${opSym(t.op)}</button>`:`<span class="ex-o">${opSym(t.op)}</span>`;return `<span class="ex-p">${t.t}</span>`;}).join('');}
function fillTpl(tpl,tries=500){const tk=tokenize(tpl),ast=parse(tk),mv=mulSub(ast),names=uniq(tk.filter(t=>t.name).map(t=>t.name));
  for(let k=0;k<tries;k++){const vals={};for(const nm of names)vals[nm]=mv.has(nm)?rnd(2,9):rnd(2,S.set.level>=3?90:60);const fl={};const v=ev(ast,vals,fl);if(!fl.bad)return{tk,ast,vals,value:v};}return null;}
const TPL2=['A - (B + C)','A - (B - C)','(A + B) - C','A + (B - C)','A - B + C','A - B - C','A + B - C'];
const TPL3=['A - (B + C) + D','(A - B) - (C + D)','A + B - (C - D)','A - (B - C) + D','(A + B) - (C + D)','A - B + (C - D)'];

    return{kind:'custom',h2:(()=>{const x=[];stepsOf(e.ast,e.vals,x);return 'Первое действие: '+x[0].split(' = ')[0]+'.';})(),tx:`${RULE()} ${stepsHtml(e.ast,e.vals)}. Ответ: <b>${e.value}</b>.`,plain:'Порядок действий: '+txt,prompt:`<p>Сначала расставь порядок действий: нажимай на знаки по очереди — какое действие <b>первое</b>, какое <b>второе</b>… Потом посчитай каждое действие.</p>`,
      mount(A,done,miss){

        let seq=[];const btns=[...A.querySelectorAll('.ex-op')];const st=[];stepsOf(e.ast,e.vals,st);

        $('#undo').onclick=()=>{seq=[];paint();};

          if(k===0)$('#s2').innerHTML=`<p class="step" style="text-align:center">Порядок верный! Теперь считай по действиям и записывай ответы:</p><div class="slines" id="slines"></div><div id="kp2"></div>`;
          if(k>=st.length){$('#kp2').innerHTML='';done(true,e.value,`Значение выражения: <b>${e.value}</b>.`);return;}
          const[lhs,r]=st[k].split(' = ');const line=document.createElement('div');line.className='sline';line.innerHTML=`<b>${k+1})</b> ${lhs} = <span class="hl">?</span>`;$('#slines').appendChild(line);
          keypad($('#kp2'),v=>{if(v===+r){line.innerHTML=`<b>${k+1})</b> ${lhs} = <b style="color:var(--ok)">${r}</b>`;setTimeout(()=>stepRun(k+1),350);return true;}miss(`${lhs} = ${v}`);return false;});
        }

          if(seq.length===correct.length){
            if(!seq.every((v,j)=>v===correct[j])){miss('другой порядок действий');const ex=$('#ex');ex.classList.add('shake');setTimeout(()=>{ex.classList.remove('shake');seq=[];paint();},500);return;}
            btns.forEach(x=>{x.disabled=true;});$('#undo').hidden=true;stepRun(0);}});
      }};}
  if(k==='value'){const e=anyExpr();return{kind:'input',prompt:`<p>Найди значение выражения:</p><div class="expr">${exprHtml(e.tk,e.vals,false)}</div>`,plain:exprText(e.tk,e.vals),answer:e.value,explain:`${RULE()}<br>${stepsHtml(e.ast,e.vals)}`};}
  if(k==='compare'){let pairs=[['A - (B + C)','A - B + C'],['A - (B - C)','A - B - C'],['(A + B) - C','A + B - C'],['A + (B - C)','A + B - C'],['A - (B + C)','A - B - C'],['A - (B - C)','A - B + C']];
    if(S.set.parenMul)pairs=pairs.concat([['(A + B) · C','A + B · C'],['A · (B + C)','A · B + C']]);
    for(let g=0;g<60;g++){const[p1,p2]=shuffle(pick(pairs));const e1=fillTpl(p1);if(!e1)continue;const tk2=tokenize(p2),a2=parse(tk2),fl={};const v2=ev(a2,e1.vals,fl);if(fl.bad)continue;
      const sign=e1.value<v2?'<':e1.value>v2?'>':'=';
      return{kind:'choice',cls:'three',prompt:`<p>Сравни, не торопись. Какой знак вместо ○?</p><div class="expr" style="padding-top:4px">${exprHtml(e1.tk,e1.vals,false)}<span class="ex-o" style="color:var(--gold)">○</span>${exprHtml(tk2,e1.vals,false)}</div>`,plain:`${exprText(e1.tk,e1.vals)} ○ ${exprText(tk2,e1.vals)}`,options:['<','=','>'],answer:sign,

/* ---------- badges, streaks ---------- */
const starSum=pf=>STATIONS.reduce((a,s)=>a+((pf.st[s.id]||{}).stars||0),0);
const BADGES=[
 ['first','🌟','Первая звезда',pf=>starSum(pf)>=1],['ten','💫','10 звёзд',pf=>starSum(pf)>=10],['thirty','🌠','30 звёзд',pf=>starSum(pf)>=30],
 ['half','🎖️','Половина пути',pf=>STATIONS.filter(s=>(pf.st[s.id]||{}).stars>0).length>=STATIONS.length/2],['all','👑','Все полянки пройдены',pf=>STATIONS.every(s=>(pf.st[s.id]||{}).stars>0)],
 ['gold','🥇','Три полянки на три звезды',pf=>STATIONS.filter(s=>(pf.st[s.id]||{}).stars===3).length>=3],
 ['book','📘','Таблица собрана',pf=>Object.values(pf.book||{}).some(b=>Object.keys(b).length>=10)],
 ['s5','🔥','5 верных подряд',pf=>(pf.best||0)>=5],['s10','⚡','10 верных подряд',pf=>(pf.best||0)>=10],['cr','💎','50 кристаллов',pf=>pf.crystals>=50],
];
function checkBadges(){const pf=PF();pf.badges=pf.badges||{};for(const[id,ic,name,cond] of BADGES){if(!pf.badges[id]&&cond(pf)){pf.badges[id]=Date.now();toast(`Новый значок: ${ic} ${name}`);sfx.win();}}save();}
function bump(good){const pf=PF();pf.streak=good?(pf.streak||0)+1:0;pf.best=Math.max(pf.best||0,pf.streak);if(good&&(pf.streak===5||pf.streak===10))checkBadges();return pf.streak;}
// arcades: +1 life for every 5 correct answers in a row
function lifeBonus(streak,lives){if(streak>0&&streak%5===0&&isFinite(lives)&&lives<S.set.lives){toast('+1 жизнь за 5 верных подряд!');return lives+1;}return lives;}

/* ---------- step runner ---------- */
function stepRunner(box,steps,miss,onDone){
  box.innerHTML='<div class="slines"></div><div class="kpx"></div>';const L=box.querySelector('.slines'),K=box.querySelector('.kpx');
  const run=k=>{if(k>=steps.length){K.innerHTML='';onDone();return;}const s=steps[k];const line=document.createElement('div');line.className='sline';line.innerHTML=`<b>${k+1})</b> ${s.t} = <span class="hl">?</span>`;L.appendChild(line);
    keypad(K,v=>{if(v===s.a){line.innerHTML=`<b>${k+1})</b> ${s.t} = <b style="color:var(--ok)">${s.a}</b>`;setTimeout(()=>run(k+1),350);return true;}miss(`${s.t} = ${v}`);return false;});};
  run(0);
}

    mount(A,done,miss){stepRunner(A,[{t:'Клеток в одном ряду',a},{t:'Рядов',a:b},{t:`Площадь: ${a} · ${b}`,a:a*b}],miss,()=>done(true,a*b,ex));}};
  return{kind:'custom',plain:`Нарисовать прямоугольник: ${b} рядов по ${a}`,tx:ex,h2:`Рядов должно быть ${b} (сверху вниз), а в каждом ряду ${a} (слева направо).`,
    prompt:`<p>Нарисуй грядку: <b>${b} ${pl(b,'ряд','ряда','рядов')} по ${a} ${pl(a,'клетке','клетки','клеток')}</b>. Проведи пальцем или мышкой от одного угла до другого.</p>`,
    mount(A,done,miss){

      const paint=()=>{g.querySelectorAll('.rc').forEach(x=>{const r=+x.dataset.r,c=+x.dataset.c;x.classList.toggle('on',!!sel&&r>=sel.r0&&r<=sel.r1&&c>=sel.c0&&c<=sel.c1);});$('#rinfo').textContent=sel?`Рядов: ${sel.r1-sel.r0+1}, в каждом ряду: ${sel.c1-sel.c0+1}`:'Пока ничего не нарисовано';};
      const upd=p=>{if(!st||!p)return;sel={r0:Math.min(st[0],p[0]),r1:Math.max(st[0],p[0]),c0:Math.min(st[1],p[1]),c1:Math.max(st[1],p[1])};paint();};
      g.addEventListener('pointerdown',e=>{if(lock||A.dataset.dead)return;const p=cellAt(e);if(!p)return;st=p;upd(p);try{g.setPointerCapture(e.pointerId);}catch(x){}});
      g.addEventListener('pointermove',e=>{if(st&&!lock)upd(cellAt(e));});

      $('#chk').onclick=()=>{if(!sel)return;const rr=sel.r1-sel.r0+1,cc=sel.c1-sel.c0+1;

        stepRunner($('#s3'),[{t:`Площадь: ${a} · ${b}`,a:a*b}],miss,()=>done(true,a*b,ex));};
    }};

/* ---------- strategy trainer ---------- */
function genTricks(i){

  if(t===2){how=`Умножить на 2 — значит удвоить ${m}.`;steps=[{t:`${m} + ${m}`,a:d}];}
  else if(t===3){how=`Удвой ${m}, потом прибавь ${m} ещё раз.`;steps=[{t:`${m} + ${m}`,a:d},{t:`${d} + ${m}`,a:d+m}];}
  else if(t===4){how=`Удвой ${m}, а потом удвой ещё раз.`;steps=[{t:`${m} + ${m}`,a:d},{t:`${d} + ${d}`,a:d+d}];}
  else if(t===5&&m%2===0){how=`Возьми ${m} десять раз, а потом найди половину.`;steps=[{t:`10 · ${m}`,a:10*m},{t:`Половина от ${10*m}`,a:5*m}];}
  else if(t===5){how=`Удвой ${m} дважды — это четыре раза. Потом прибавь ${m} ещё раз.`;steps=[{t:`${m} + ${m}`,a:d},{t:`${d} + ${d}`,a:2*d},{t:`${2*d} + ${m}`,a:5*m}];}
  else if(t===6){how=`Возьми ${m} пять раз и прибавь ещё ${m}.`;steps=[{t:`5 · ${m}`,a:5*m},{t:`${5*m} + ${m}`,a:6*m}];}
  else if(t===7){how=`Пять раз по ${m} и ещё два раза по ${m}.`;steps=[{t:`5 · ${m}`,a:5*m},{t:`2 · ${m}`,a:2*m},{t:`${5*m} + ${2*m}`,a:7*m}];}
  else if(t===8){how=`Удвой ${m} три раза подряд.`;steps=[{t:`${m} + ${m}`,a:d},{t:`${d} + ${d}`,a:2*d},{t:`${2*d} + ${2*d}`,a:4*d}];}
  else{how=`Возьми ${m} десять раз и убери ${m} один раз.`;steps=[{t:`10 · ${m}`,a:10*m},{t:`${10*m} − ${m}`,a:9*m}];}
  steps.push({t:`Значит, ${m} · ${t}`,a:t*m});
  return{kind:'custom',fact:[t,m],plain:`Приём: ${m} · ${t}`,h1:how,h2:`Первое действие: ${steps[0].t}.`,tx:steps.map((s,k)=>`${k+1}) ${s.t} = ${s.a}`).join('; ')+'.',

    mount(A,done,miss){stepRunner(A,steps,miss,()=>done(true,t*m,`${m} · ${t} = ${t*m}. Этот приём подходит для любого числа: так можно найти ответ, даже если забыла таблицу.`));}};
}

/* ---------- build an expression ---------- */
function genBuild(i){
  let pool=['A - (B + C)','A - (B - C)','(A + B) - C','A + (B - C)','A - B + C','A - B - C','A + B - C','A + B + C'];
  if(S.set.parenMul)pool=pool.concat(['A + B · C','(A + B) · C','A · B - C','A - B · C','A · (B + C)','A · (B - C)','A · B + C']);
  let e=null;for(let g=0;g<30&&!e;g++)e=fillTpl(pick(pool));if(!e)e=fillTpl('A - B + C');
  const n=['A','B','C'].map(k=>e.vals[k]),target=e.value,OPS=S.set.parenMul?['+','-','·']:['+','-'];
  const sol=exprText(e.tk,e.vals);
  return{kind:'custom',plain:`Составить выражение из ${n.join(', ')} с ответом ${target}`,tx:`Например: ${sol} = ${target}.`,h2:`Первый знак: «${opSym(e.tk.find(t=>t.t==='op').op)}».`,
    prompt:`<p>Расставь знаки и, если нужно, скобки, чтобы получилось <b>${target}</b>. Нажимай на окошки между числами.</p>`,
    mount(A,done,miss){
      const ops=[null,null];let br=0;
      A.innerHTML=`<div class="expr" id="bex" style="padding-top:4px"></div><div class="seg" id="bbr" style="justify-content:center;margin:12px auto 0"><button data-v="0">без скобок</button><button data-v="1">(□ □) □</button><button data-v="2">□ (□ □)</button></div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="chk">Проверить</button></div>`;
      const paint=()=>{const P=x=>`<span class="ex-p">${x}</span>`,O=k=>`<button class="ex-op${ops[k]?' on':''}" data-k="${k}" aria-label="знак ${k+1}">${ops[k]?opSym(ops[k]):'?'}</button>`,N=k=>`<span class="ex-n">${n[k]}</span>`;
        $('#bex').innerHTML=(br===1?P('('):'')+N(0)+O(0)+(br===2?P('('):'')+N(1)+(br===1?P(')'):'')+O(1)+N(2)+(br===2?P(')'):'')+`<span class="ex-o">=</span><span class="ex-n" style="color:var(--gold)">${target}</span>`;
        $('#bex').querySelectorAll('.ex-op').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;ops[k]=OPS[(OPS.indexOf(ops[k])+1)%OPS.length];sfx.tick();paint();});
        $('#bbr').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===br)));};
      $('#bbr').querySelectorAll('button').forEach(b=>b.onclick=()=>{br=+b.dataset.v;paint();});
      $('#chk').onclick=()=>{if(!ops[0]||!ops[1])return;const s=(br===1?'(':'')+n[0]+ops[0]+(br===2?'(':'')+n[1]+(br===1?')':'')+ops[1]+n[2]+(br===2?')':'');
        const tk=tokenize(s),ast=parse(tk);const calc=x=>x.t==='n'?x.tok.v:(x.op==='+'?calc(x.l)+calc(x.r):x.op==='-'?calc(x.l)-calc(x.r):calc(x.l)*calc(x.r));const v=calc(ast);
        if(v===target)done(true,exprText(tk,{}),`${exprText(tk,{})} = ${target}. ${stepsHtml(ast,{})}`);else miss(`${exprText(tk,{})} = ${v}`);};
      paint();
    }};
}

/* ---------- bar models for word problems ---------- */
function scheme(type,p){
  const B=(x,y,w,h,t,cls)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" class="sb ${cls||''}"/><text x="${x+w/2}" y="${y+h/2+6}" class="st" text-anchor="middle">${t}</text>`;
  const Q=(x,w,y,t)=>`<path d="M${x} ${y} v8 h${w} v-8" class="sq"/><text x="${x+w/2}" y="${y+26}" class="st sqq" text-anchor="middle">${t||'?'}</text>`;
  let h='';
  if(type==='G'){const b=Math.min(p.b,6),w=Math.min(44,(p.x>0?190:250)/b);let x=10;for(let k=0;k<b;k++){h+=B(x,14,w-3,34,p.a,p.x<0&&k===b-1?'':'');x+=w;}
    if(p.x>0){h+=B(x,14,56,34,p.x,'s2');x+=59;h+=Q(10,x-13,54);}else if(p.x<0){h+=Q(10,x-13,54,'?');h+=`<text x="${x+8}" y="36" class="st sm2">убрали ${-p.x}</text>`;}else h+=Q(10,x-13,54);}
  else if(type==='W'){h+=B(10,8,270,30,p.n);h+=B(10,44,88,30,p.x,'s2')+B(101,44,88,30,p.y,'s2')+B(192,44,88,30,'?','s3');}
  else if(type==='D'){h+=B(10,8,200,30,p.n);h+=B(10,44,70,30,'− '+p.x,'s4')+B(83,44,127,30,'')+B(213,44,67,30,'+ '+p.y,'s2');h+=Q(83,197,78);}
  else{h+=B(10,10,120,28,p.a)+B(10,46,210,28,p.b,'s2')+`<path d="M130 10 v28 M130 24 h90 M220 10 v28" class="sq"/><text x="175" y="20" class="st sqq" text-anchor="middle">?</text>`;}
  return `<svg class="schm" viewBox="0 0 290 108" role="img" aria-label="Схема к задаче">${h}</svg>`;
}

  const jr=fin=>jrec(sn,{item:'mole',section:stn.name,done:fin,ok:fin&&hits>=GOAL,miss:wrong,result:`верных ударов: ${hits} из ${GOAL}, ошибок: ${wrong}`,detail:errs.join('; ')||'без ошибок'});
  const newRule=()=>{const T=S.set.tables;let n=pick(T);if(T.length>1)while(n===t)n=pick(T);t=n;$('#mr').textContent=`Бей числа из таблицы на ${t}`;moles.fill(null);paint();};

  function end(){state='over';jr(true);const st=lives<=0?(hits>=GOAL/2?1:0):wrong===0?3:wrong<=2?2:1;finishStation('mole',hits,GOAL,st);setTimeout(()=>{if(scr==='game')endScreen('mole',hits,GOAL,st,`<p class="mini">Ошибок: ${wrong}.</p>`);},600);}
  const iv=setInterval(()=>{if(paused||state!=='run')return;acc+=100;
    moles.forEach((m,k)=>{if(m&&(m.t-=100)<=0)moles[k]=null;});
    if(acc>=gap){acc=0;const free=moles.map((m,k)=>m?-1:k).filter(k=>k>=0);if(free.length>3){const k=pick(free);let v;if(Math.random()<.55)v=t*rnd(1,10);else{do{v=rnd(2,t*10);}while(v%t===0);}moles[k]={v,t:ttl};}}
    paint();},100);
  cleanup=()=>clearInterval(iv);
  document.querySelectorAll('.hole').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='run'||paused)return;const k=+b.dataset.k,m=moles[k];if(!m||m.hit||m.bad)return;
    if(inT(m.v)){m.hit=true;m.t=350;hits++;streak++;rec(t,m.v/t,true);bump(true);lives=lifeBonus(streak,lives);sfx.ok();hud();jr(false);if(hits>=GOAL)return end();if(hits%4===0)setTimeout(()=>{if(state==='run')newRule();},400);}
    else{m.bad=true;m.t=500;wrong++;streak=0;bump(false);if(isFinite(lives))lives--;errs.push(`${m.v} нет в таблице на ${t}`);logMistake(stn.name,`Есть ли ${m.v} в таблице на ${t}?`,'да','нет');sfx.bad();hud();jr(false);if(lives<=0)return end();}

/* ---------- arcade: sort into tables ---------- */
function startSort(){
  const stn=ST.sort,L=S.set.level,TOTAL=12,T=shuffle(S.set.tables).slice(0,2).sort((a,b)=>a-b);
  const inT=(n,t)=>n%t===0&&n<=t*10;const cat=n=>{const r=T.map(t=>inT(n,t));return r[0]&&!r[1]?0:(r[1]&&!r[0]?1:(!r[0]&&!r[1]?2:-1));};
  const names=T.map(t=>`Таблица на ${t}`).concat(T.length>1?'Ни там, ни там':'Не из таблицы');const NONE=T.length>1?2:1;
  const catOf=n=>T.length>1?cat(n):(inT(n,T[0])?0:1);
  const items=[];let g=0;while(items.length<TOTAL&&g++<2000){const want=rnd(0,NONE),n=rnd(2,Math.max(...T)*10);if(catOf(n)===want&&!items.includes(n))items.push(n);}
  setScreen(`<div class="wrap play">${topbar(stn,true)}
   <div class="hud"><div class="lives" id="lives" aria-label="Жизни"></div><div class="qbig" style="font-size:20px">Куда положить число?</div><div class="score" id="ssc">0 / ${TOTAL}</div></div>
   <div class="stage" style="padding:8px"><div class="lane" id="lane"><div class="fcard" id="fc" hidden></div></div>
    <div class="overlay" id="ov"><h3>Сортировка</h3><p>Число падает сверху. Пока оно летит, нажми на корзину, в которую оно подходит. Не успела или ошиблась — минус жизнь.</p><button class="btn primary" id="go">Старт</button></div></div>
   <div class="opts three" id="bask">${names.map((n,k)=>`<button class="opt" data-k="${k}" style="font-size:16px">${n}</button>`).join('')}</div></div>`,'game');
  bindTop();inGame=true;const sn=curSess=sess();const errs=[];
  let state='ready',lives=livesMax(),i=0,okc=0,y=0,wait=0,streak=0,alive=true;const dur=[0,9,7,5][L],fc=$('#fc'),lane=$('#lane');
  const hud=()=>{$('#lives').textContent=heartStr(lives);$('#ssc').textContent=`${okc} / ${TOTAL}`;};
  const jr=fin=>jrec(sn,{item:'sort',section:stn.name,done:fin,ok:fin&&starsFor(okc,TOTAL)>=1,miss:i-okc,result:`верно ${okc} из ${i} (всего ${TOTAL})`,detail:errs.join('; ')||'без ошибок'});
  function end(){state='over';fc.hidden=true;jr(true);const st=finishStation('sort',okc,TOTAL);setTimeout(()=>{if(alive)endScreen('sort',okc,TOTAL,st);},600);}
  function next(){if(i>=TOTAL||lives<=0)return end();y=0;fc.textContent=items[i];fc.hidden=false;fc.className='fcard';fc.style.left=(12+Math.random()*60)+'%';}
  function answer(k){if(state!=='run'||wait>0||paused)return;const n=items[i],c=catOf(n),good=k===c;
    T.forEach(t=>{if(inT(n,t))rec(t,n/t,good);});bump(good);
    if(good){okc++;streak++;lives=lifeBonus(streak,lives);sfx.ok();fc.classList.add('good');}
    else{streak=0;if(isFinite(lives))lives--;errs.push(`${n}: ${k<0?'не успела':names[k]}, верно — ${names[c]}`);logMistake(stn.name,`Куда положить ${n}?`,k<0?'не успела':names[k],names[c]);sfx.bad();fc.classList.add('badc');
      const b=document.querySelector(`#bask .opt[data-k="${c}"]`);b.classList.add('right');setTimeout(()=>b.classList.remove('right'),800);}
    i++;hud();jr(false);save();wait=.8;}
  document.querySelectorAll('#bask .opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  let last=performance.now(),raf=0;
  function loop(now){if(!alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(state==='run'&&!paused){if(wait>0){wait-=dt;if(wait<=0)next();}else{y+=dt/dur;if(y>=1)answer(-1);else fc.style.top=(y*(lane.clientHeight-56))+'px';}}
    raf=requestAnimationFrame(loop);}
  raf=requestAnimationFrame(loop);cleanup=()=>{alive=false;cancelAnimationFrame(raf);};
  const begin=()=>{if(state!=='ready')return;$('#ov').hidden=true;state='run';hud();next();};
  $('#go').onclick=begin;hud();
  window.onkeydown=e=>{if(e.key==='Enter'&&state==='ready'){e.preventDefault();begin();}else if(/^[1-3]$/.test(e.key)&&+e.key<=names.length)answer(+e.key-1);};
}

    <p class="mini">Настройки сохраняются в этом браузере и действуют со следующего задания или новой игры.</p>
  </section>
  <section class="card panel"><h3>Карта таблицы умножения — ${esc(whoName())}</h3>
    <p class="mini">Строка — таблица, столбец — второй множитель. В клетке: верно / всего. Игра чаще задаёт примеры с ошибками.</p>
    <div class="heatwrap"><table class="heat"><thead><tr><th></th>${Array.from({length:10},(_,k)=>`<th>·${k+1}</th>`).join('')}</tr></thead><tbody>${heatRows}</tbody></table></div>
    <div class="legend"><span><i style="background:rgba(98,227,166,.75)"></i>90% и выше</span><span><i style="background:rgba(243,201,108,.8)"></i>70–89%</span><span><i style="background:rgba(255,125,157,.85)"></i>меньше 70%</span><span><i style="background:var(--night)"></i>ещё не было</span></div>
  </section>
  <section class="card panel"><h3>Последние ошибки — ${esc(whoName())}</h3>
    ${pf.mistakes.length?`<ol class="mlist">${pf.mistakes.slice(0,20).map(m=>`<li><span class="mini">${jDt(m.d)} · ${esc(m.s)}</span><br>${esc(m.q.slice(0,140))} — ответ <em>${esc(m.g)}</em>, верно <strong>${esc(m.r)}</strong></li>`).join('')}</ol>`:'<p class="mini">Ошибок пока нет. Полная история игр — в журнале решений.</p>'}
  </section>
  <details class="card"><summary>Как учить умножение по Петерсон</summary><div class="method">
    <h3>1. Сначала смысл, потом таблица</h3>
    <p>В курсе Петерсон a · b читается как «по a взять b раз»: a + a + … + a. Пусть ребёнок сам переводит картинку в сумму, сумму в произведение и обратно. Это полянка «Волшебные мешочки». Хороший вопрос дома: «Покажи мне 3 · 4 на пуговицах».</p>
    <h3>2. Переместительное свойство экономит половину таблицы</h3>
    <p>Зная 2 · 7, ребёнок знает и 7 · 2. Отдельно проговорите два правила: любое число · 1 — само число, любое число · 0 — ноль.</p>
    <h3>3. Стратегии вместо зубрёжки</h3>
    <ul><li>×2 — удвой число.</li><li>×4 — удвой дважды.</li><li>×3 — удвой и добавь ещё одну группу.</li><li>×5 — половина от ×10.</li><li>×9 — ×10 и вычесть одну группу.</li></ul>
    <h3>4. Точность раньше скорости</h3>
    <p>Порядок: теория и мешочки, зеркало, книга заклинаний, потом лабиринт и перехват. Если в аркадах много ошибок, снизьте сложность и уберите обратный отсчёт.</p>
    <h3>5. Коротко и каждый день</h3>
    <p>10–15 минут в день дают больше, чем час раз в неделю. Смотрите карту выше и разбирайте красные клетки на предметах.</p>
    <h3>6. Скобки и порядок действий</h3>
    <p>Как в учебнике: над каждым знаком ставим номер действия. Умножение раньше сложения включайте переключателем, когда оно появится на уроках.</p>
    <h3>7. Ошибка — повод поговорить</h3>
    <p>После каждой ошибки игра показывает решение. Попросите ребёнка объяснить его своими словами.</p>
  </div></details>
  <section class="card panel"><h3>Сброс</h3>
    ${confirmReset?`<p>Звёзды, кристаллы, книга заклинаний и карта ошибок ученика «${esc(whoName())}» удалятся. Журнал и настройки останутся.</p><div class="row"><button class="btn danger" id="rsYes">Да, сбросить</button><button class="btn ghost" id="rsNo">Отмена</button></div>`:`<div class="row"><button class="btn ghost" id="rs">Сбросить прогресс ученика</button></div>`}
  </section></div>`;
  if(keep&&scr==='pro'){app.innerHTML=html;window.scrollTo(0,y);}else setScreen(html,'pro');
  const re=()=>{save();pro(true);};
  $('#back').onclick=()=>{confirmReset=false;home();};$('#toLog').onclick=()=>journal();
  app.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=sg.dataset.seg;T[k]=k==='timer'?b.dataset.v:+b.dataset.v;re();}));
  $('#s-secs').onchange=e=>{T.secs=+e.target.value;save();};$('#s-pin').onchange=e=>{T.pin=e.target.value.trim();save();toast(T.pin?'Код учителя сохранён':'Код учителя убран');};
  app.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{T[b.dataset.sw]=!T[b.dataset.sw];re();});
  app.querySelectorAll('.chip[data-t]').forEach(b=>b.onclick=()=>{const t=+b.dataset.t,has=T.tables.includes(t);if(has&&T.tables.length===1)return;T.tables=has?T.tables.filter(x=>x!==t):[...T.tables,t].sort((a,b)=>a-b);re();});
  app.querySelectorAll('.chip[data-who]').forEach(b=>b.onclick=()=>{const n=b.dataset.who;if(S.roster.includes(n)){S.who=n;re();}});
  const norm=v=>v.trim().replace(/\s+/g,' ').slice(0,16);
  app.querySelectorAll('.rrow input[data-i]').forEach(inp=>inp.onchange=()=>{const i=+inp.dataset.i,old=S.roster[i],nw=norm(inp.value);if(!nw||nw===old||S.roster.includes(nw)){inp.value=old;return;}S.roster[i]=nw;if(S.prof[old]){S.prof[nw]=S.prof[old];delete S.prof[old];}if(S.who===old)S.who=nw;re();});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const n=S.roster[+b.dataset.del];S.roster.splice(+b.dataset.del,1);if(S.who===n)S.who=S.roster[0]||'';re();});
  $('#addKid').onsubmit=e=>{e.preventDefault();const n=norm($('#newKid').value);if(!n||S.roster.includes(n))return;S.roster.push(n);if(!S.who)S.who=n;re();};
  if(confirmReset){$('#rsYes').onclick=()=>{S.prof[S.who||'_']=DEFP();confirmReset=false;re();};$('#rsNo').onclick=()=>{confirmReset=false;pro(true);};}
  else $('#rs').onclick=()=>{confirmReset=true;pro(true);};
}

window.__tern={genRect,genTricks,genBuild,genBags,genMirror,genParen,genMagic,genLogic,genEuler,genKitchen,genBoss,S:()=>S};
home();if(!S.who)hello();
})();
</script>
